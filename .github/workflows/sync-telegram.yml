name: Sync Telegram Thoughts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Telegram messages
        run: node scripts/sync-telegram.js

      # Translations are written locally, in the next session that touches
      # content (`pnpm translate:thoughts` lists what is pending); until then
      # the page shows the original. Translating here once made the commit
      # depend on an API key that was never set, and from 10-30 to 11-07 nine
      # fetched messages were dropped because of it.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/thoughts.json
          # public/thoughts only exists once a message with a photo has synced,
          # and `git add` on a missing path exits 128, which would kill the step.
          if [ -d public/thoughts ]; then git add public/thoughts; fi
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync telegram thoughts"
          # main moves while this runs; on 11-05 the push was rejected for that.
          git pull --rebase
          git push
